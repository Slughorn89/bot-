name: typer

on:
  push:
    paths: ["typer/**", ".github/workflows/typer.yml"]
  pull_request:
    paths: ["typer/**", ".github/workflows/typer.yml"]
  schedule:
    - cron: "41 3 * * *"   # nocą pełny zestaw z testami statystycznymi

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: typer/requirements.txt
      - run: pip install -r requirements.txt
      - name: Testy szybkie
        if: github.event_name != 'schedule'
        run: python -m pytest -q -m "not slow"
      - name: Pełny zestaw (nocą)
        if: github.event_name == 'schedule'
        run: python -m pytest -q
