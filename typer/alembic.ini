[alembic]
script_location = typer/store/migrations
prepend_sys_path = .
# URL bazy brany z DATABASE_URL (.env), patrz typer/store/migrations/env.py

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s: %(message)s
