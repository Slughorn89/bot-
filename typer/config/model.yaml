# Model produkcyjny (champion). Parametry ocen online ze strojenia na walidacji 2018-07..2025-06
# (python cli.py tune), J = 1.67541 (start 1.68354). Szczegoly: experiments.md.
version: op-v1
layers: online+blend+cal    # zestaw warstw z pipeline/backtest.py LAYER_SETS (wybor: experiments.md, wpisy 4-9)
value_threshold: 0.05       # minimalna przewaga p*kurs-1
kelly_fraction: 0.25
tax_rate: 0.0               # w Polsce u legalnego bukmachera: 0.12
bet_markets: ["1X2", "OU2.5"]
# Challengerzy typuja w cieniu (role=challenger) na tych samych meczach, bez zakladow.
# Awans: >= 300 wspolnych zdarzen, CI90 roznicy log loss (sparowany bootstrap) < 0, bramki OK.
challengers:
  - version: op-v1-nocal
    layers: online+blend
    changes: >-
      NAPRAWA 2026-11-04 (holdout E0 1X2 luka +0.0024): hipoteza, ze globalna kalibracja po mieszance
      psuje rynek w E0. Na walidacji gorszy od championa o 0.0003 (1X2), na holdoucie luka E0 nieistotna
      po korekcie Bonferroniego, wiec tylko test w cieniu na nowym okresie.
online_poisson:
  lr_team: 0.014336
  lr_home: 0.0026667
  lr_mu: 0.00059259
  w_xg: 0.2
  season_regress: 0.0
  promoted_atk: -0.18
  promoted_obr: -0.21
  new_team_boost: 1.0
  new_team_tau: 8.0
  red_card_weight: 1.0
  rho: -0.09
  init_mu: 0.15
  init_home: 0.25
  xg_sot: 0.27
  xg_off: 0.006
# Modul 2: model goli (typer/models/goals). Strojenie i wybor na walidacji 2018-07..2025-06
# (backtest/goal_models/grid_final.json, experiments.md wpisy 16-19). Champion produkcyjny zostaje
# przy ocenach online: zaden wariant nie byl istotnie lepszy w zadnej lidze.
goal_models:
  half_life: 240
  w_xg: 0.2
  ridge: 3.0
  use_context: false      # cechy kontekstu pogorszyly J istotnie (wpis 18)
  variant_per_league: {E0: bivariate, D1: bivariate, I1: bivariate, SP1: bivariate, F1: bivariate, POL: bivariate}
