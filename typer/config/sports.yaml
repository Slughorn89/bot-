# Sporty i ligi. Zasada skilla: jeden sport od poczatku do konca, dopiero potem kolejny.
# Klucz ligi = kod football-data.co.uk (wspolny dla adapterow).
football:
  timezone: Europe/Warsaw
  # Rozliczenie (sekcja 12: void wedlug reguly z danych). Mecz o tych statusach = void dla wszystkich
  # predykcji i zakladow, nawet jesli zrodlo podaje jakis wynik (np. przerwany przy 1:0).
  # Linie calkowite O/U i AH 0 maja zwrot (push) przy remisie na linii.
  void_statuses: [postponed, abandoned, cancelled]
  markets: ["1X2", "OU2.5", "BTTS"]
  leagues:
    E0:
      name: Premier League
      country: ENG
      odds_api: soccer_epl
      fduk: {kind: main, code: E0}
      odds_timing: prematch      # kursy Bet365 z football-data: zbierane w piatek/wtorek przed meczem
      has_shots: true
    D1:
      name: Bundesliga
      country: GER
      odds_api: soccer_germany_bundesliga
      fduk: {kind: main, code: D1}
      odds_timing: prematch
      has_shots: true
    I1:
      name: Serie A
      country: ITA
      odds_api: soccer_italy_serie_a
      fduk: {kind: main, code: I1}
      odds_timing: prematch
      has_shots: true
    SP1:
      name: La Liga
      country: ESP
      odds_api: soccer_spain_la_liga
      fduk: {kind: main, code: SP1}
      odds_timing: prematch
      has_shots: true
    F1:
      name: Ligue 1
      country: FRA
      odds_api: soccer_france_ligue_one
      fduk: {kind: main, code: F1}
      odds_timing: prematch
      has_shots: true
    POL:
      name: Ekstraklasa
      country: POL
      odds_api: soccer_poland_ekstraklasa
      fduk: {kind: new, code: POL}
      # W kopii z GitHuba nie wiadomo, czy kursy dla POL sa sprzed meczu, czy zamkniecia.
      # Dlatego uzywamy ich tylko jako benchmarku rynku, nigdy jako kursu "wzietego".
      odds_timing: unknown
      has_shots: false
      fix_dates: swap_day_month   # blad w kopii xgabora, patrz typer/ingest/xgabora.py
  # 2026-11-08: ligi tylko do cyklu dziennego (typy, cli.py tips/history), poza backtestem i referencja
  # regresji: graja takze w przerwach reprezentacyjnych (sprawdzone na danych: 10-20.11.2025 graly
  # E2, E3, SC1, SP2). Bez osobnej walidacji, typy tylko informacyjne.
  extra_leagues:
    E1:
      name: Championship
      country: ENG
      odds_api: soccer_efl_champ
      fduk: {kind: main, code: E1}
      odds_timing: prematch
      has_shots: true
    E2:
      name: League One
      country: ENG
      odds_api: soccer_england_league1
      fduk: {kind: main, code: E2}
      odds_timing: prematch
      has_shots: true
    E3:
      name: League Two
      country: ENG
      odds_api: soccer_england_league2
      fduk: {kind: main, code: E3}
      odds_timing: prematch
      has_shots: true
    SC0:
      name: Scottish Premiership
      country: SCO
      odds_api: soccer_spl
      fduk: {kind: main, code: SC0}
      odds_timing: prematch
      has_shots: true
    SC1:
      name: Scottish Championship
      country: SCO
      fduk: {kind: main, code: SC1}
      odds_timing: prematch
      has_shots: true
    SP2:
      name: Segunda Division
      country: ESP
      odds_api: soccer_spain_segunda_division
      fduk: {kind: main, code: SP2}
      odds_timing: prematch
      has_shots: true
